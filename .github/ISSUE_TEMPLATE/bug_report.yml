name: Bug report / 问题反馈
description: Report a reproducible problem using synthetic data only.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach real HAR files, tokens, cookies, private keys or customer information. Use a small synthetic example."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include a minimal synthetic input when needed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and version / 浏览器、系统与版本
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 数据检查
      options:
        - label: I removed credentials and real business data from this report.
          required: true
